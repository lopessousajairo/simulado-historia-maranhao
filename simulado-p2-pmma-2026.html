<script>
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function studyExtras(text, exp, isCorrectAnswer){
  const t=String(text||''), e=String(exp||'');
  const low=t.toLowerCase();
  const absolutes=['sempre','nunca','somente','apenas','exclusivamente','obrigatoriamente','imediatamente','totalmente','qualquer','todos','nenhum'];
  const found=absolutes.find(w=>low.includes(w));
  const years=[...new Set((t+' '+e).match(/\b(?:15|16|17|18|19|20)\d{2}\b/g)||[])];
  const auth=(t+' '+e).match(/Governador|Comandante-Geral|Presidente|Congresso|Assembleia Legislativa|União|Estado|Município/gi);
  let peg='A banca mexeu em um detalhe central do enunciado. Compare cada palavra com a regra/conceito correto antes de marcar.';
  if(found) peg=`Palavra de risco: “${found.toUpperCase()}”. A CEBRASPE usa termos absolutos para transformar uma ideia quase correta em item errado.`;
  else if(years.length) peg=`Pegadinha de cronologia/data. O item exige separar corretamente ${years.slice(0,4).join(', ')} e o fato ligado a cada marco.`;
  else if(auth&&auth.length) peg=`Pegadinha de competência/sujeito. Observe QUEM pratica o ato: ${[...new Set(auth)].slice(0,3).join(' / ')}.`;
  else if(!isCorrectAnswer) peg='O enunciado parece plausível, mas contém inversão, troca de conceito, sujeito, condição ou consequência. Na CEBRASPE, uma palavra errada derruba o item inteiro.';

  let mac='Leia em 3 passos: SUJEITO → REGRA → EXCEÇÃO. Se um dos três estiver trocado, marque ERRADO.';
  if(years.length>=2) mac=`🗓️ Linha do tempo: ${years.slice(0,4).join(' → ')}. Prenda cada data ao acontecimento correto.`;
  else if(years.length===1) mac=`🗓️ Grave o marco ${years[0]} junto ao fato principal da explicação; data trocada é pegadinha clássica.`;
  else if(auth&&auth.length) mac=`👤 Decore pelo “QUEM FAZ”: destaque a autoridade do item antes de olhar o restante da frase.`;
  else if(found) mac=`🚨 Viu “${found.toUpperCase()}”? Diminua a velocidade. Termos absolutos merecem conferência dobrada.`;

  let inv='Trocar um termo-chave, inverter a causa/consequência, mudar a autoridade competente, alterar uma data ou transformar exceção em regra.';
  const frase=e.replace(/^\s*(CERTO|ERRADO)\.?\s*/i,'').split(/(?<=[.!?])\s+/)[0].trim();
  let memo=frase ? `📌 Frase-chave: ${frase}` : '📌 Fixe a regra central em uma frase curta antes de avançar.';
  return `<div class="studybox"><div class="studyrow"><b>🎯 ONDE ESTÁ A PEGADINHA</b><br>${esc(peg)}</div><div class="studyrow"><b>🧠 MACETE / MNEMÔNICO</b><br>${esc(mac)}<br>${esc(memo)}</div><div class="studyrow"><b>⚠️ COMO A CEBRASPE PODE INVERTER</b><br>${esc(inv)}</div></div>`;
}
const Q=[{"n": 1, "area": "Legislação Institucional", "text": "O Estatuto dos Policiais-Militares da PMMA regula a situação, as obrigações, os direitos, os deveres e as prerrogativas dos policiais militares.", "g": true, "exp": "CERTO. É o objeto expresso do art. 1º da Lei estadual nº 6.513/1995."}, {"n": 2, "area": "Legislação Institucional", "text": "Para fins do Estatuto da PMMA, militar de carreira é aquele que desempenha voluntária e permanentemente o serviço policial-militar e possui estabilidade assegurada ou presumida.", "g": true, "exp": "CERTO. O Estatuto caracteriza dessa forma o militar de carreira."}, {"n": 3, "area": "Legislação Institucional", "text": "Os componentes da reserva remunerada, ainda que convocados, permanecem juridicamente na inatividade durante todo o período da convocação.", "g": false, "exp": "ERRADO. Quando convocados, os componentes da reserva remunerada figuram entre os militares na ativa."}, {"n": 4, "area": "Legislação Institucional", "text": "O aluno de curso de formação policial-militar encontra-se, para fins estatutários, na situação de inatividade.", "g": false, "exp": "ERRADO. Os alunos dos cursos de formação estão incluídos entre os militares na ativa."}, {"n": 5, "area": "Legislação Institucional", "text": "O militar reformado é dispensado definitivamente da prestação de serviço na ativa, continuando a perceber remuneração do Estado.", "g": true, "exp": "CERTO. Essa é a característica estatutária da reforma."}, {"n": 6, "area": "Legislação Institucional", "text": "A carreira policial-militar é atividade continuada, inteiramente devotada às finalidades da Polícia Militar e privativa do pessoal da ativa.", "g": true, "exp": "CERTO. É conceito clássico do Estatuto."}, {"n": 7, "area": "Legislação Institucional", "text": "Posto é o grau hierárquico do oficial e graduação é o grau hierárquico da praça.", "g": true, "exp": "CERTO. Grave esta dupla: POSTO = oficial; GRADUAÇÃO = praça."}, {"n": 8, "area": "Legislação Institucional", "text": "A graduação da praça é conferida por ato do Governador do Estado, da mesma forma que o posto do oficial.", "g": false, "exp": "ERRADO. A banca troca as competências: posto e graduação possuem formas próprias de provimento."}, {"n": 9, "area": "Legislação Institucional", "text": "A hierarquia e a disciplina constituem a base institucional da Polícia Militar.", "g": true, "exp": "CERTO. É fundamento central da organização militar."}, {"n": 10, "area": "Legislação Institucional", "text": "A hierarquia policial-militar consiste na ordenação da autoridade em níveis diferentes dentro da estrutura da Polícia Militar.", "g": true, "exp": "CERTO. A ordenação ocorre por postos e graduações e, dentro deles, pela antiguidade."}, {"n": 11, "area": "Legislação Institucional", "text": "Disciplina militar significa exclusivamente obediência pessoal ao superior hierárquico, independentemente de leis e regulamentos.", "g": false, "exp": "ERRADO. Disciplina envolve rigorosa observância e acatamento integral das leis, regulamentos, normas e disposições."}, {"n": 12, "area": "Legislação Institucional", "text": "Os círculos hierárquicos são âmbitos de convivência entre militares da mesma categoria e destinam-se, entre outros fins, ao desenvolvimento da camaradagem.", "g": true, "exp": "CERTO. Não confunda círculo de convivência com posto ou graduação."}, {"n": 13, "area": "Legislação Institucional", "text": "A precedência entre militares do mesmo grau hierárquico é, em regra, estabelecida pela antiguidade no posto ou na graduação.", "g": true, "exp": "CERTO. Antiguidade é critério central de precedência dentro do mesmo grau."}, {"n": 14, "area": "Legislação Institucional", "text": "O cargo policial-militar é considerado vago apenas quando criado por lei e ainda não ocupado, jamais em decorrência de exoneração, dispensa ou falecimento.", "g": false, "exp": "ERRADO. Há outras hipóteses legais de vacância; o termo 'apenas' torna o item falso."}, {"n": 15, "area": "Legislação Institucional", "text": "Função policial-militar corresponde ao exercício das obrigações inerentes ao cargo policial-militar.", "g": true, "exp": "CERTO. É uma distinção conceitual importante do Estatuto."}, {"n": 16, "area": "Legislação Institucional", "text": "O sentimento do dever, o pundonor policial-militar e o decoro da classe influenciam a conduta do militar tanto no serviço quanto fora dele.", "g": true, "exp": "CERTO. A ética militar não fica restrita ao horário de serviço."}, {"n": 17, "area": "Legislação Institucional", "text": "A condição de policial militar autoriza o uso do posto ou da graduação para obter facilidades pessoais em atividades particulares.", "g": false, "exp": "ERRADO. Utilizar a condição funcional para obter vantagem pessoal afronta a ética policial-militar."}, {"n": 18, "area": "Legislação Institucional", "text": "A disciplina militar torna lícita a execução de ordem manifestamente criminosa, desde que proveniente de superior hierárquico.", "g": false, "exp": "ERRADO. Hierarquia não transforma ordem criminosa em ordem lícita."}, {"n": 19, "area": "Legislação Institucional", "text": "A violação das obrigações ou dos deveres policiais-militares pode constituir crime, contravenção ou transgressão disciplinar, conforme o caso.", "g": true, "exp": "CERTO. O enquadramento depende da natureza da conduta."}, {"n": 20, "area": "Legislação Institucional", "text": "Agregação é situação temporária e, por si só, não equivale à exclusão definitiva do serviço ativo.", "g": true, "exp": "CERTO. Agregação não rompe definitivamente o vínculo."}, {"n": 21, "area": "Legislação Institucional", "text": "O militar agregado deixa necessariamente de pertencer ao respectivo quadro da Corporação.", "g": false, "exp": "ERRADO. Na agregação, ele permanece vinculado ao quadro, embora em situação própria e fora da escala numérica nas hipóteses legais."}, {"n": 22, "area": "Legislação Institucional", "text": "A transferência para a reserva remunerada implica automaticamente perda do posto ou da graduação.", "g": false, "exp": "ERRADO. Inatividade não significa perda automática do grau hierárquico."}, {"n": 23, "area": "Legislação Institucional", "text": "Reserva remunerada e reforma são situações de inatividade juridicamente idênticas, inclusive quanto à possibilidade de convocação.", "g": false, "exp": "ERRADO. São situações distintas; o reformado é dispensado definitivamente da prestação de serviço na ativa."}, {"n": 24, "area": "Legislação Institucional", "text": "A transferência para a reserva remunerada pode ocorrer a pedido ou ex officio, observados os requisitos legais.", "g": true, "exp": "CERTO. Há hipóteses voluntárias e compulsórias."}, {"n": 25, "area": "Legislação Institucional", "text": "A estabilidade da praça impede, em qualquer hipótese, sua exclusão a bem da disciplina.", "g": false, "exp": "ERRADO. Estabilidade não cria imunidade disciplinar."}, {"n": 26, "area": "Legislação Institucional", "text": "Conselho de Disciplina relaciona-se, nas hipóteses legais, à apreciação da capacidade de determinadas praças permanecerem nas fileiras da Corporação.", "g": true, "exp": "CERTO. É uma associação clássica: Conselho de Disciplina → praça."}, {"n": 27, "area": "Legislação Institucional", "text": "Conselho de Justificação é instituto relacionado aos oficiais, nas hipóteses previstas em lei.", "g": true, "exp": "CERTO. Macete: Justificação → oficial; Disciplina → praça."}, {"n": 28, "area": "Legislação Institucional", "text": "Demissão é instituto de exclusão do serviço ativo relacionado ao oficial, não devendo ser confundido com as formas próprias aplicáveis às praças.", "g": true, "exp": "CERTO. A banca costuma trocar 'demissão' e 'licenciamento'."}, {"n": 29, "area": "Legislação Institucional", "text": "Licenciamento e demissão são expressões rigorosamente sinônimas no Estatuto e podem ser aplicadas indistintamente a oficiais e praças.", "g": false, "exp": "ERRADO. São institutos distintos."}, {"n": 30, "area": "Legislação Institucional", "text": "A convocação de militar da reserva remunerada para serviço ativo transitório pode depender de aceitação voluntária, conforme a hipótese legal.", "g": true, "exp": "CERTO. A voluntariedade é ponto recorrente de cobrança."}, {"n": 31, "area": "Legislação Institucional", "text": "Por já integrar a reserva remunerada, o militar convocado para serviço ativo transitório está sempre dispensado de inspeção de saúde.", "g": false, "exp": "ERRADO. A inspeção de saúde integra a disciplina legal da convocação."}, {"n": 32, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional define as polícias militares como instituições militares permanentes, exclusivas e típicas de Estado.", "g": true, "exp": "CERTO. É redação da Lei nº 14.751/2023."}, {"n": 33, "area": "Legislação Institucional", "text": "Segundo a Lei Orgânica Nacional, as polícias militares são forças auxiliares e reserva do Exército.", "g": true, "exp": "CERTO. A lei reproduz a posição constitucional dessas instituições."}, {"n": 34, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional organiza as polícias militares sem referência à hierarquia e à disciplina, pois tais princípios são exclusivos das Forças Armadas.", "g": false, "exp": "ERRADO. Hierarquia e disciplina militares são expressamente bases dessas instituições."}, {"n": 35, "area": "Legislação Institucional", "text": "Às polícias militares cabe, no âmbito legal, a preservação da ordem pública e a polícia ostensiva.", "g": true, "exp": "CERTO. São atribuições centrais das polícias militares."}, {"n": 36, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional exclui as polícias militares do Sistema Único de Segurança Pública (Susp).", "g": false, "exp": "ERRADO. As polícias militares integram o Susp."}, {"n": 37, "area": "Legislação Institucional", "text": "Legalidade, impessoalidade, moralidade, publicidade, eficiência, razoabilidade e proporcionalidade figuram entre princípios previstos na Lei Orgânica Nacional.", "g": true, "exp": "CERTO. A Lei nº 14.751/2023 enumera esses e outros princípios."}, {"n": 38, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional admite que a polícia militar exerça prerrogativas inerentes à polícia ostensiva, à preservação da ordem pública e à polícia judiciária militar, nos limites legais.", "g": true, "exp": "CERTO. A norma nacional contempla expressamente essas funções."}, {"n": 39, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional determina que a Polícia Militar seja comandada por civil indicado livremente pelo governador.", "g": false, "exp": "ERRADO. A lei estabelece comando por oficial da ativa do último posto, integrante do QOEM da respectiva instituição."}, {"n": 40, "area": "Legislação Institucional", "text": "A Lei Orgânica Nacional revogou dispositivos do Decreto-Lei nº 667/1969, mas não extinguiu a natureza militar das polícias militares estaduais.", "g": true, "exp": "CERTO. Ao contrário, a Lei nº 14.751/2023 reafirma expressamente sua natureza militar."}, {"n": 41, "area": "Noções de Informática", "text": "No Windows, a combinação Shift+Delete pode excluir um arquivo sem enviá-lo à Lixeira.", "g": true, "exp": "CERTO. É uma pegadinha clássica de gerenciamento de arquivos."}, {"n": 42, "area": "Noções de Informática", "text": "No Explorador de Arquivos do Windows, extensões de nomes de arquivos jamais podem ser ocultadas.", "g": false, "exp": "ERRADO. A exibição das extensões pode ser configurada."}, {"n": 43, "area": "Noções de Informática", "text": "Linux pode ser operado tanto por interface gráfica quanto por linha de comando.", "g": true, "exp": "CERTO. Linux não é sinônimo de terminal."}, {"n": 44, "area": "Noções de Informática", "text": "Em sistemas Linux, /home é tradicionalmente associado aos diretórios pessoais de usuários comuns.", "g": true, "exp": "CERTO. É o local típico dos diretórios pessoais."}, {"n": 45, "area": "Noções de Informática", "text": "Em Linux, /etc é tradicionalmente associado a arquivos de configuração do sistema.", "g": true, "exp": "CERTO. Macete: ETC → configurações."}, {"n": 46, "area": "Noções de Informática", "text": "Microsoft Word e LibreOffice Writer são sistemas operacionais.", "g": false, "exp": "ERRADO. Ambos são processadores de texto."}, {"n": 47, "area": "Noções de Informática", "text": "Microsoft Excel e LibreOffice Calc são aplicativos de planilha eletrônica.", "g": true, "exp": "CERTO. Excel ↔ Calc."}, {"n": 48, "area": "Noções de Informática", "text": "Em planilhas eletrônicas, fórmulas são normalmente iniciadas pelo sinal de igual (=).", "g": true, "exp": "CERTO. Exemplo: =SOMA(A1:A5)."}, {"n": 49, "area": "Noções de Informática", "text": "Ao copiar uma fórmula, a referência $A$1 é absoluta, mantendo fixas a coluna A e a linha 1.", "g": true, "exp": "CERTO. Dois cifrões = coluna e linha fixas."}, {"n": 50, "area": "Noções de Informática", "text": "Na referência A$1, a coluna A é absoluta e a linha 1 é relativa.", "g": false, "exp": "ERRADO. É o contrário: a linha 1 está fixa; a coluna A é relativa."}, {"n": 51, "area": "Noções de Informática", "text": "PowerPoint e Impress são aplicativos destinados à criação de apresentações.", "g": true, "exp": "CERTO. PowerPoint é da Microsoft; Impress é do LibreOffice."}, {"n": 52, "area": "Noções de Informática", "text": "Uma intranet não pode utilizar protocolos da família TCP/IP, pois estes são exclusivos da Internet pública.", "g": false, "exp": "ERRADO. Intranets normalmente utilizam TCP/IP e tecnologias da Internet."}, {"n": 53, "area": "Noções de Informática", "text": "URL é utilizada para identificar/localizar recursos, como páginas e arquivos, em uma rede.", "g": true, "exp": "CERTO. É um mecanismo de endereçamento de recursos."}, {"n": 54, "area": "Noções de Informática", "text": "HTTPS utiliza TLS para proteger a comunicação HTTP.", "g": true, "exp": "CERTO. O canal é protegido criptograficamente."}, {"n": 55, "area": "Noções de Informática", "text": "A presença de HTTPS garante que o site acessado não contém malware nem realiza fraude.", "g": false, "exp": "ERRADO. HTTPS protege a comunicação; não garante a honestidade do conteúdo."}, {"n": 56, "area": "Noções de Informática", "text": "Google Chrome e Mozilla Firefox são navegadores web.", "g": true, "exp": "CERTO. Ambos são browsers."}, {"n": 57, "area": "Noções de Informática", "text": "Google Search e Google Chrome são sinônimos: ambos são navegadores web.", "g": false, "exp": "ERRADO. Google Search é mecanismo de busca; Chrome é navegador."}, {"n": 58, "area": "Noções de Informática", "text": "No e-mail, Cco/Bcc permite ocultar dos demais destinatários os endereços inseridos nesse campo.", "g": true, "exp": "CERTO. Cco = cópia oculta."}, {"n": 59, "area": "Noções de Informática", "text": "SMTP é protocolo associado ao envio de mensagens de correio eletrônico.", "g": true, "exp": "CERTO. Macete: SMTP → envio."}, {"n": 60, "area": "Noções de Informática", "text": "IMAP favorece a sincronização de mensagens mantidas no servidor entre diferentes dispositivos.", "g": true, "exp": "CERTO. É uma vantagem típica do IMAP."}, {"n": 61, "area": "Noções de Informática", "text": "POP3 e IMAP têm como finalidade principal criptografar anexos de e-mail.", "g": false, "exp": "ERRADO. São protocolos ligados ao acesso/recebimento de mensagens."}, {"n": 62, "area": "Noções de Informática", "text": "Computação em nuvem permite disponibilizar recursos computacionais sob demanda por meio de rede.", "g": true, "exp": "CERTO. É característica fundamental de cloud computing."}, {"n": 63, "area": "Noções de Informática", "text": "O uso de armazenamento em nuvem torna desnecessárias autenticação e políticas de controle de acesso.", "g": false, "exp": "ERRADO. Nuvem não elimina responsabilidades de segurança."}, {"n": 64, "area": "Noções de Informática", "text": "Backup é uma cópia de dados destinada a possibilitar recuperação após perda, corrupção ou incidente.", "g": true, "exp": "CERTO. O objetivo é recuperação."}, {"n": 65, "area": "Noções de Informática", "text": "Sincronização em nuvem é sempre equivalente a um backup independente, pois uma exclusão local jamais é propagada.", "g": false, "exp": "ERRADO. A sincronização pode propagar exclusões; sincronizar não é necessariamente fazer backup."}, {"n": 66, "area": "Noções de Informática", "text": "Um worm pode se propagar automaticamente por redes sem precisar se anexar a um arquivo hospedeiro.", "g": true, "exp": "CERTO. Essa capacidade autônoma é característica dos worms."}, {"n": 67, "area": "Noções de Informática", "text": "Phishing busca enganar a vítima para obter dados ou induzi-la a executar determinada ação.", "g": true, "exp": "CERTO. É técnica clássica de engenharia social."}, {"n": 68, "area": "Noções de Informática", "text": "Firewall pode filtrar/controlar tráfego segundo regras, mas não substitui todas as demais camadas de segurança.", "g": true, "exp": "CERTO. Segurança deve ser feita em camadas."}, {"n": 69, "area": "Noções de Informática", "text": "A manutenção de antivírus atualizado torna dispensáveis as atualizações do sistema operacional e os backups.", "g": false, "exp": "ERRADO. Antivírus não substitui atualização, backup nem comportamento seguro."}, {"n": 70, "area": "Noções de Informática", "text": "Autenticação multifator aumenta a proteção ao exigir fator adicional além de uma única senha.", "g": true, "exp": "CERTO. MFA reduz o risco causado pelo comprometimento isolado da senha."}];let cur=0,A=Array(Q.length).fill(null),start=Date.now(),timer=setInterval(tick,1000);
function tick(){let s=Math.floor((Date.now()-start)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),z=String(s%60).padStart(2,'0');clock.textContent=`${h}:${m}:${z}`}tick();
function render(){let q=Q[cur];num.textContent=`Questão ${q.n} de 70`;area.textContent=q.area;text.textContent=q.text;bar.style.width=((cur+1)/70*100)+'%';bt.className='';bf.className='';fb.className='';fb.innerHTML='';if(A[cur]!==null){let ok=A[cur]===q.g;(A[cur]?bt:bf).classList.add('selected');if(!ok)(A[cur]?bt:bf).classList.add('wrong');fb.className='show';fb.innerHTML=`<b class="${ok?'ok':'bad'}">${ok?'✓ ACERTO':'✗ ERRO'}</b><br><b>Gabarito: ${q.g?'CERTO':'ERRADO'}</b><br><b>📚 POR QUÊ:</b> ${q.exp}`+studyExtras(q.text,q.exp,q.g)}stats()}
function mark(v){if(A[cur]===null){A[cur]=v;render()}}function go(d){cur=Math.max(0,Math.min(69,cur+d));render()}
function stats(){let a=0,e=0;Q.forEach((q,i)=>{if(A[i]!==null)(A[i]===q.g?a++:e++)});ac.textContent=a;er.textContent=e;pts.textContent=a-e;perc.textContent=(a+e?Math.round(a/(a+e)*100):0)+'%';[...pal.children].forEach((b,i)=>b.classList.toggle('done',A[i]!==null))}
Q.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{cur=i;render()};pal.appendChild(b)});
function finish(){let n=A.filter(x=>x!==null).length;if(n<70&&!confirm(`Você respondeu ${n}/70. Finalizar mesmo assim?`))return;clearInterval(timer);let a=0,e=0,lc=0,ic=0;Q.forEach((q,i)=>{if(A[i]!==null){let ok=A[i]===q.g;if(ok)a++;else e++;if(ok&&i<40)lc++;if(ok&&i>=40)ic++}});score.textContent=`${a-e} pontos`;summary.innerHTML=`Tempo: <b>${clock.textContent}</b><br>Acertos: <b>${a}</b> • Erros: <b>${e}</b> • Em branco: <b>${70-a-e}</b><br>Legislação: <b>${lc}/40 acertos</b><br>Informática: <b>${ic}/30 acertos</b><br><br>Critério simulado: +1 acerto, −1 erro, 0 em branco.`;modal.classList.add('on')}
function restart(){if(!confirm('Reiniciar respostas e cronômetro?'))return;A=Array(70).fill(null);cur=0;start=Date.now();clearInterval(timer);timer=setInterval(tick,1000);modal.classList.remove('on');render()}render();</script></body></html>
