<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco 01 — Legislação PMMA</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf4ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 100px}h1{font-size:23px;margin:0}.sub{color:#9fb1c8;margin:6px 0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.box,.card{background:#0e1b2d;border:1px solid #263b55;border-radius:14px}.box{padding:10px;text-align:center}.box b{display:block;font-size:20px}.box small,.area{color:#9fb1c8}.timer{margin:10px 0;padding:11px 13px;display:flex;justify-content:space-between;background:#0e1b2d;border-radius:12px}.prog{height:7px;background:#14263b;border-radius:8px;overflow:hidden}#bar{height:100%;background:#66d9a6}.card{padding:17px;margin-top:15px}#num{font-weight:800;color:#66d9a6}.area{font-size:12px;margin-top:4px}#text{font-size:18px;line-height:1.45;margin:15px 0}.ans{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{background:#12243a;color:#edf4ff;border:1px solid #304965;padding:13px;border-radius:11px;font-weight:750}.selected{border-color:#66d9a6}.wrong{border-color:#ff8585}#fb{display:none;margin-top:13px;background:#091726;padding:12px;border-radius:11px;line-height:1.42}#fb.show{display:block}.ok{color:#66d9a6}.bad{color:#ff8585}.nav{display:flex;gap:8px;margin-top:13px}.nav button{flex:1}#pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}#pal button{padding:7px 1px;font-size:11px}#pal .done{border-color:#66d9a6}footer{position:fixed;bottom:0;left:0;right:0;background:#081421f2;border-top:1px solid #263b55;padding:9px}footer div{max-width:760px;margin:auto;display:flex;gap:8px}footer button{flex:1}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.result{max-width:500px;width:100%;background:#0e1b2d;border:1px solid #304965;border-radius:18px;padding:20px}.score{font-size:42px;font-weight:900}.result button{width:100%;margin-top:9px}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}#pal{grid-template-columns:repeat(7,1fr)}}
</style></head><body><main><h1>Banco 01 • Legislação PMMA</h1><div class="sub">50 questões inéditas • nível CEBRASPE • Estatuto + Constituição + Lei Orgânica Nacional</div>
<div class="stats"><div class="box"><b id="ac">0</b><small>Acertos</small></div><div class="box"><b id="er">0</b><small>Erros</small></div><div class="box"><b id="pts">0</b><small>Pontos</small></div><div class="box"><b id="perc">0%</b><small>Aproveitamento</small></div></div>
<div class="timer"><span>⏱ Cronômetro</span><b id="clock">00:00:00</b></div><div class="prog"><div id="bar"></div></div>
<section class="card"><div id="num"></div><div class="area">LEGISLAÇÃO INSTITUCIONAL • PMMA</div><div id="text"></div><div class="ans"><button id="bt" onclick="mark(true)">CERTO</button><button id="bf" onclick="mark(false)">ERRADO</button></div><div id="fb"></div><div class="nav"><button onclick="go(-1)">← Anterior</button><button onclick="go(1)">Próxima →</button></div></section><div id="pal"></div></main>
<footer><div><button onclick="finish()">Finalizar banco</button><button onclick="restart()">Recomeçar</button></div></footer>
<div class="modal" id="modal"><div class="result"><h2>Resultado — Banco 01</h2><div class="score" id="score"></div><div id="summary"></div><button onclick="modal.classList.remove('on')">Revisar questões</button><button onclick="restart()">Refazer banco</button></div></div>
<script>const Q=[{"n": 1, "text": "A carreira policial-militar é caracterizada por atividade continuada e inteiramente devotada às finalidades da Polícia Militar, sendo privativa do pessoal da ativa.", "g": true, "exp": "CERTO. A carreira policial-militar é vinculada ao pessoal da ativa e às finalidades institucionais."}, {"n": 2, "text": "Os militares da reserva remunerada são considerados na ativa mesmo quando não estejam convocados para o serviço ativo.", "g": false, "exp": "ERRADO. O integrante da reserva remunerada está na inatividade; a convocação altera a situação enquanto durar o serviço ativo."}, {"n": 3, "text": "O militar reformado encontra-se na inatividade e está dispensado definitivamente da prestação de serviço na ativa.", "g": true, "exp": "CERTO. Reforma e reserva remunerada não são sinônimos: o reformado está definitivamente dispensado da prestação de serviço ativo."}, {"n": 4, "text": "Posto e patente são expressões juridicamente idênticas, sendo ambas conferidas às praças.", "g": false, "exp": "ERRADO. Posto é grau hierárquico do oficial; patente é a prerrogativa/título ligada ao oficialato. Praça possui graduação."}, {"n": 5, "text": "As patentes dos oficiais da Polícia Militar do Maranhão são conferidas pelo Governador do Estado.", "g": true, "exp": "CERTO. A Constituição do Maranhão atribui ao Governador a conferência das patentes dos oficiais."}, {"n": 6, "text": "A graduação corresponde ao grau hierárquico da praça.", "g": true, "exp": "CERTO. Macete: POSTO = oficial; GRADUAÇÃO = praça."}, {"n": 7, "text": "A hierarquia policial-militar consiste na ordenação da autoridade em níveis diferentes dentro da estrutura da Corporação.", "g": true, "exp": "CERTO. A autoridade é ordenada em níveis hierárquicos."}, {"n": 8, "text": "A disciplina policial-militar restringe-se ao cumprimento das ordens do superior imediato.", "g": false, "exp": "ERRADO. Disciplina envolve observância e acatamento das leis, regulamentos, normas e disposições, e não apenas ordens do superior imediato."}, {"n": 9, "text": "Hierarquia e disciplina constituem bases institucionais das organizações militares estaduais.", "g": true, "exp": "CERTO. É fundamento constitucional e legal da organização militar."}, {"n": 10, "text": "A antiguidade é irrelevante para a precedência entre militares que possuam o mesmo grau hierárquico.", "g": false, "exp": "ERRADO. Dentro do mesmo posto ou graduação, a antiguidade é critério relevante de precedência."}, {"n": 11, "text": "Os círculos hierárquicos são destinados exclusivamente à definição da cadeia de comando operacional.", "g": false, "exp": "ERRADO. São também âmbitos de convivência entre militares da mesma categoria, favorecendo camaradagem e confiança."}, {"n": 12, "text": "Função policial-militar corresponde ao exercício das obrigações inerentes ao cargo policial-militar.", "g": true, "exp": "CERTO. A banca costuma inverter cargo e função."}, {"n": 13, "text": "A vacância de cargo policial-militar somente pode decorrer de falecimento de seu ocupante.", "g": false, "exp": "ERRADO. Existem outras hipóteses legais de vacância; a palavra 'somente' torna o item falso."}, {"n": 14, "text": "O militar da ativa que aceitar cargo público civil permanente será, como regra constitucional estadual, transferido para a reserva, ressalvadas as hipóteses constitucionalmente admitidas.", "g": true, "exp": "CERTO. A Constituição do Maranhão prevê essa consequência, ressalvando as acumulações constitucionalmente permitidas."}, {"n": 15, "text": "O militar da ativa que aceitar cargo, emprego ou função pública temporária, não eletiva, ainda que da administração indireta, jamais poderá ser agregado.", "g": false, "exp": "ERRADO. A Constituição estadual prevê justamente a agregação nessa hipótese, observadas suas regras."}, {"n": 16, "text": "A agregação equivale à exclusão definitiva do militar do quadro da Corporação.", "g": false, "exp": "ERRADO. Agregação é situação temporária; não é exclusão definitiva."}, {"n": 17, "text": "O militar agregado pode permanecer vinculado ao respectivo quadro, embora em situação especial prevista em lei.", "g": true, "exp": "CERTO. Agregação não rompe definitivamente o vínculo com o quadro."}, {"n": 18, "text": "A transferência para a reserva remunerada implica automaticamente a perda do posto ou da graduação.", "g": false, "exp": "ERRADO. Reserva remunerada é situação de inatividade, não perda automática do grau hierárquico."}, {"n": 19, "text": "Reserva remunerada e reforma são formas de inatividade, mas possuem efeitos jurídicos distintos.", "g": true, "exp": "CERTO. Uma das pegadinhas mais comuns é tratá-las como institutos idênticos."}, {"n": 20, "text": "A praça estável é absolutamente imune à exclusão a bem da disciplina.", "g": false, "exp": "ERRADO. Estabilidade não elimina a possibilidade de exclusão nas hipóteses e mediante os procedimentos legais."}, {"n": 21, "text": "O Conselho de Disciplina está relacionado, nas hipóteses legais, à análise da capacidade de determinadas praças permanecerem nas fileiras da Corporação.", "g": true, "exp": "CERTO. Macete: DISCIPLINA → praça."}, {"n": 22, "text": "O Conselho de Justificação é instituto ligado à situação de oficiais, conforme as hipóteses previstas em lei.", "g": true, "exp": "CERTO. Macete: JUSTIFICAÇÃO → oficial."}, {"n": 23, "text": "Conselho de Justificação e Conselho de Disciplina são expressões sinônimas e aplicáveis indistintamente a oficiais e praças.", "g": false, "exp": "ERRADO. São institutos distintos e associados a categorias diferentes."}, {"n": 24, "text": "A demissão é forma de exclusão do serviço ativo relacionada ao oficialato.", "g": true, "exp": "CERTO. Não confunda demissão de oficial com institutos próprios das praças."}, {"n": 25, "text": "Licenciamento e demissão podem ser empregados indistintamente no Estatuto, pois produzem sempre os mesmos efeitos e atingem as mesmas categorias.", "g": false, "exp": "ERRADO. São institutos distintos."}, {"n": 26, "text": "A exclusão a bem da disciplina possui natureza expulsória e depende da observância das hipóteses e do procedimento legal aplicável.", "g": true, "exp": "CERTO. Não existe expulsão válida simplesmente por vontade informal da autoridade."}, {"n": 27, "text": "A condenação criminal de qualquer policial militar, qualquer que seja a pena aplicada, acarreta automaticamente exclusão a bem da disciplina.", "g": false, "exp": "ERRADO. A consequência não decorre de toda e qualquer condenação de modo automático; devem ser observados os pressupostos e procedimentos legais."}, {"n": 28, "text": "O dever de obediência hierárquica autoriza o subordinado a cumprir ordem manifestamente criminosa sem qualquer responsabilidade.", "g": false, "exp": "ERRADO. Hierarquia não legitima ordem manifestamente criminosa."}, {"n": 29, "text": "A ética policial-militar alcança a conduta do militar tanto na vida funcional quanto, em diversos aspectos, na vida particular.", "g": true, "exp": "CERTO. A ética militar não termina quando acaba o turno de serviço."}, {"n": 30, "text": "O uso do posto ou da graduação para obter vantagem pessoal estranha ao serviço é compatível com a ética militar desde que não haja prejuízo financeiro ao Estado.", "g": false, "exp": "ERRADO. O uso da condição funcional para obtenção de facilidades pessoais afronta a ética, ainda que não haja prejuízo financeiro ao Estado."}, {"n": 31, "text": "A violação dos deveres e obrigações policiais-militares pode, conforme a conduta, constituir crime, contravenção ou transgressão disciplinar.", "g": true, "exp": "CERTO. A natureza jurídica dependerá do enquadramento da conduta."}, {"n": 32, "text": "A convocação de militar da reserva remunerada para serviço ativo transforma definitivamente sua situação em militar da ativa, impedindo o retorno à reserva.", "g": false, "exp": "ERRADO. A convocação é transitória; encerrada a hipótese legal, não há transformação definitiva automática."}, {"n": 33, "text": "A inspeção de saúde pode integrar os requisitos legais relacionados à convocação de militar da reserva remunerada.", "g": true, "exp": "CERTO. É ponto recorrente nas questões sobre convocação."}, {"n": 34, "text": "A aceitação voluntária pode ser requisito da convocação da reserva remunerada nas hipóteses previstas na legislação estadual.", "g": true, "exp": "CERTO. Atenção às questões que tentam transformar a convocação em imposição automática."}, {"n": 35, "text": "Segundo a Constituição Federal, às polícias militares cabem a polícia ostensiva e a preservação da ordem pública.", "g": true, "exp": "CERTO. É a regra do art. 144, § 5º, da Constituição Federal."}, {"n": 36, "text": "As polícias militares exercem, com exclusividade, as funções de polícia judiciária da União.", "g": false, "exp": "ERRADO. A polícia judiciária da União é função da Polícia Federal; às PMs cabem polícia ostensiva e preservação da ordem pública, além das competências militares previstas em lei."}, {"n": 37, "text": "As polícias militares e os corpos de bombeiros militares são forças auxiliares e reserva do Exército.", "g": true, "exp": "CERTO. É previsão constitucional e também reafirmada pela Lei Orgânica Nacional."}, {"n": 38, "text": "A Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares retirou dessas instituições sua natureza militar.", "g": false, "exp": "ERRADO. A Lei nº 14.751/2023 reafirma expressamente sua natureza militar."}, {"n": 39, "text": "A Lei nº 14.751/2023 estabelece normas gerais aplicáveis às polícias militares e aos corpos de bombeiros militares dos Estados, do Distrito Federal e dos Territórios.", "g": true, "exp": "CERTO. Trata-se da Lei Orgânica Nacional dessas instituições."}, {"n": 40, "text": "Hierarquia e disciplina militares permanecem princípios estruturantes na Lei Orgânica Nacional.", "g": true, "exp": "CERTO. A lei nacional preserva expressamente essas bases."}, {"n": 41, "text": "A Lei Orgânica Nacional considera as polícias militares instituições permanentes, típicas de Estado e essenciais à preservação da ordem pública.", "g": true, "exp": "CERTO. A lei reforça a natureza permanente e típica de Estado das PMs."}, {"n": 42, "text": "A Polícia Militar não integra o Sistema Único de Segurança Pública porque possui natureza militar.", "g": false, "exp": "ERRADO. A natureza militar não exclui a PM do Sistema Único de Segurança Pública."}, {"n": 43, "text": "Legalidade, impessoalidade, moralidade, publicidade e eficiência são incompatíveis com a administração militar e, por isso, não se aplicam às polícias militares.", "g": false, "exp": "ERRADO. Os princípios administrativos também vinculam a administração militar."}, {"n": 44, "text": "A polícia ostensiva pode compreender atuação preventiva destinada à preservação da ordem pública.", "g": true, "exp": "CERTO. A atuação ostensiva da PM tem forte dimensão preventiva."}, {"n": 45, "text": "A apuração de infrações penais militares, nas hipóteses legais, é incompatível com qualquer atuação da Polícia Militar.", "g": false, "exp": "ERRADO. A instituição possui atribuições relacionadas à polícia judiciária militar nos limites legais."}, {"n": 46, "text": "O fato de a Polícia Militar ser força auxiliar e reserva do Exército significa que ela integra permanentemente as Forças Armadas.", "g": false, "exp": "ERRADO. PMs são instituições militares estaduais; ser força auxiliar e reserva do Exército não as transforma em Forças Armadas."}, {"n": 47, "text": "A subordinação administrativa da Polícia Militar estadual ao Governador é compatível com sua condição constitucional de força auxiliar e reserva do Exército.", "g": true, "exp": "CERTO. As duas características coexistem constitucionalmente."}, {"n": 48, "text": "A Constituição do Maranhão assegura as patentes, com as prerrogativas, direitos e deveres a elas inerentes, aos oficiais da ativa, da reserva ou reformados.", "g": true, "exp": "CERTO. É previsão expressa da Constituição estadual."}, {"n": 49, "text": "O militar reformado perde automaticamente o direito ao uso de seu título e posto, pois tais prerrogativas são exclusivas dos oficiais da ativa.", "g": false, "exp": "ERRADO. A Constituição estadual assegura as patentes também aos oficiais da reserva e reformados."}, {"n": 50, "text": "A disciplina militar afasta a incidência dos princípios da legalidade e do devido processo legal nos procedimentos administrativos militares.", "g": false, "exp": "ERRADO. Regime militar não elimina legalidade, contraditório, ampla defesa e devido processo nas hipóteses constitucionalmente aplicáveis."}];let cur=0,A=Array(50).fill(null),start=Date.now(),timer=setInterval(tick,1000);
function tick(){let s=Math.floor((Date.now()-start)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),z=String(s%60).padStart(2,'0');clock.textContent=`${h}:${m}:${z}`}tick();
function render(){let q=Q[cur];num.textContent=`Questão ${q.n} de 50`;text.textContent=q.text;bar.style.width=((cur+1)/50*100)+'%';bt.className='';bf.className='';fb.className='';fb.innerHTML='';if(A[cur]!==null){let ok=A[cur]===q.g;(A[cur]?bt:bf).classList.add('selected');if(!ok)(A[cur]?bt:bf).classList.add('wrong');fb.className='show';fb.innerHTML=`<b class="${ok?'ok':'bad'}">${ok?'✓ ACERTO':'✗ ERRO'}</b><br><b>Gabarito: ${q.g?'CERTO':'ERRADO'}</b><br>${q.exp}`}stats()}
function mark(v){if(A[cur]===null){A[cur]=v;render()}}function go(d){cur=Math.max(0,Math.min(49,cur+d));render()}
function stats(){let a=0,e=0;Q.forEach((q,i)=>{if(A[i]!==null)(A[i]===q.g?a++:e++)});ac.textContent=a;er.textContent=e;pts.textContent=a-e;perc.textContent=(a+e?Math.round(a/(a+e)*100):0)+'%';[...pal.children].forEach((b,i)=>b.classList.toggle('done',A[i]!==null))}
Q.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{cur=i;render()};pal.appendChild(b)});
function finish(){let n=A.filter(x=>x!==null).length;if(n<50&&!confirm(`Você respondeu ${n}/50. Finalizar mesmo assim?`))return;clearInterval(timer);let a=0,e=0;Q.forEach((q,i)=>{if(A[i]!==null)(A[i]===q.g?a++:e++)});score.textContent=`${a-e} pontos`;summary.innerHTML=`Tempo: <b>${clock.textContent}</b><br>Acertos: <b>${a}</b> • Erros: <b>${e}</b> • Em branco: <b>${50-a-e}</b><br>Aproveitamento: <b>${a+e?Math.round(a/(a+e)*100):0}%</b><br><br>Critério de treino CEBRASPE: +1 acerto, −1 erro, 0 em branco.`;modal.classList.add('on')}
function restart(){if(!confirm('Reiniciar respostas e cronômetro?'))return;A=Array(50).fill(null);cur=0;start=Date.now();clearInterval(timer);timer=setInterval(tick,1000);modal.classList.remove('on');render()}render();</script></body></html>
